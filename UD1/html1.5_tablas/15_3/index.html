<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barberia</title>
    <style>
        table{
            border-collapse: collapse;
        }
        th, td{
            border: 1px solid black;
            text-align: center;
        }
        th{
            background-color: cadetblue;
        }
        td{
            background-color: beige;
        }
    </style>
</head>
<body>
    <table>
        <caption>BARBERIA</caption>
        <tr>
            <th colspan="3">Cortes y Barba</th>
        </tr>
        <tr>
            <td rowspan="2">Corte de pelo</td>
            <td>Sin degradado</td>
            <td>12€</td>
        </tr>
        <tr>
            <td>Degradado</td>
            <td>14€</td>
        </tr>
        <tr>
            <td>Arreglo de barba</td>
            <td>Perfilado a cuchilla</td>
            <td>7€</td>
        </tr>
        <tr>
            <td>Tinte</td>
            <td>Tinte en 1 solo color</td>
            <td>20€</td>
        </tr>

    </table>
</body>
</html>
